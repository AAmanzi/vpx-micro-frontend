name: Build release artifacts

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64
            extension: exe
          - os: macos-latest
            platform: mac
            arch: x64
            artifact: macos-x64
            extension: dmg
          - os: macos-latest
            platform: mac
            arch: arm64
            artifact: macos-arm64
            extension: dmg

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Read package version
        id: package
        shell: bash
        run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build production assets
        run: yarn build:prod

      - name: Package application
        run: >-
          yarn package:${{ matrix.platform }} --${{ matrix.arch }} --publish never
          --config.artifactName="VPX-Micro-Frontend-${{ steps.package.outputs.version }}-${{ matrix.artifact }}.${{ matrix.extension }}"
          --config.nsis.artifactName="VPX-Micro-Frontend-Setup-${{ steps.package.outputs.version }}-${{ matrix.artifact }}.exe"

      - name: Upload distributables
        uses: actions/upload-artifact@v5
        with:
          name: VPX-Micro-Frontend-${{ steps.package.outputs.version }}-${{ matrix.artifact }}
          path: dist/VPX-Micro-Frontend-${{ steps.package.outputs.version }}-${{ matrix.artifact }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v5
        with:
          name: VPX-Micro-Frontend-Setup-${{ steps.package.outputs.version }}-${{ matrix.artifact }}
          path: dist/VPX-Micro-Frontend-Setup-${{ steps.package.outputs.version }}-${{ matrix.artifact }}.exe
          if-no-files-found: error
          retention-days: 14
